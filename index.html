<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Static Chess</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/board.css" />
        <link rel="stylesheet" href="css/pieces.css" />
        <meta
            name="description"
            content="Chess in the browser for two players or against the computer. Works offline."
        />
        <meta name="theme-color" content="#282828" />
        <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
        <link rel="manifest" href="manifest.webmanifest" />
    </head>
    <body>
        <div class="game-container">
            <div class="board-container">
                <h1 class="game-title">Static Chess</h1>
                <div id="chess-board" class="chess-board" role="grid" aria-label="Chess board">
                    <!-- Board squares will be generated by JavaScript -->
                </div>
            </div>
            <div class="game-info">
                <h2>Move History</h2>
                <ul id="move-history" class="move-history">
                    <!-- Move history will be populated by JavaScript -->
                </ul>
                <div class="captured-pieces" id="captured-pieces">
                    <div class="side-row">
                        <div
                            class="captured-row"
                            id="captured-by-black"
                            role="img"
                            aria-label="Black has captured nothing."
                        ></div>
                        <span class="clock" id="clock-black" role="timer" hidden></span>
                    </div>
                    <div class="side-row">
                        <div
                            class="captured-row"
                            id="captured-by-white"
                            role="img"
                            aria-label="White has captured nothing."
                        ></div>
                        <span class="clock" id="clock-white" role="timer" hidden></span>
                    </div>
                </div>
                <div id="game-status" class="game-status">White's turn</div>
                <button id="live-button" class="live-button" hidden>Back to game</button>
                <div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>
                <div class="settings-container">
                    <div class="toggle-container" id="opponent-setting">
                        <label class="toggle-label" for="opponent-select">Opponent</label>
                        <select id="opponent-select">
                            <option value="human">Two players</option>
                            <option value="easy">Computer: easy</option>
                            <option value="medium">Computer: medium</option>
                            <option value="hard">Computer: hard</option>
                        </select>
                    </div>
                    <div class="toggle-container" id="side-setting" hidden>
                        <label class="toggle-label" for="side-select">Play as</label>
                        <select id="side-select">
                            <option value="w">White</option>
                            <option value="b">Black</option>
                        </select>
                    </div>
                    <div class="toggle-container" id="clock-setting">
                        <label class="toggle-label" for="clock-select">Clock</label>
                        <select id="clock-select" title="Applies from the next new game"></select>
                    </div>
                    <details class="more-settings" id="more-settings">
                        <summary>Settings</summary>
                        <div class="toggle-container">
                            <label class="toggle-label" for="board-theme-select">Board theme</label>
                            <select id="board-theme-select"></select>
                        </div>
                        <div class="toggle-container">
                            <label class="toggle-label" for="page-theme-select">Page theme</label>
                            <select id="page-theme-select">
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                                <option value="auto">Match system</option>
                            </select>
                        </div>
                        <div class="toggle-container">
                            <span class="toggle-label">Show coordinates</span>
                            <label class="switch">
                                <input type="checkbox" id="coords-toggle" />
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-container">
                            <span class="toggle-label">Show possible moves</span>
                            <label class="switch">
                                <input type="checkbox" id="possible-moves-toggle" checked />
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-container">
                            <span class="toggle-label">Highlight last move</span>
                            <label class="switch">
                                <input type="checkbox" id="last-move-toggle" checked />
                                <!-- Default to checked -->
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-container">
                            <span class="toggle-label">Sound effects</span>
                            <label class="switch">
                                <input type="checkbox" id="sound-toggle" />
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-container">
                            <span class="toggle-label">Flip board</span>
                            <label class="switch">
                                <input type="checkbox" id="flip-toggle" />
                                <span class="slider"></span>
                            </label>
                        </div>
                    </details>
                </div>
                <div class="buttons-row">
                    <button id="undo-button" aria-label="Undo last move">Undo</button>
                    <button id="hint-button" aria-label="Show a suggested move">Hint</button>
                    <button id="draw-button">Offer draw</button>
                    <button id="resign-button">Resign</button>
                    <button id="pgn-button" aria-label="Copy the game as PGN">Copy PGN</button>
                    <button id="reset-button">New Game</button>
                </div>
            </div>
        </div>

        <script src="js/config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/pieces.js"></script>
        <script src="js/rules.js"></script>
        <script src="js/ai.js"></script>
        <script src="js/board.js"></script>
        <script src="js/drag.js"></script>
        <script src="js/promotion.js"></script>
        <script src="js/game.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
