<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Static Chess</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/board.css" />
        <link rel="stylesheet" href="css/pieces.css" />
        <meta
            name="description"
            content="Chess in the browser for two players or against the computer. Works offline."
        />
        <meta name="theme-color" content="#282828" />
        <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
        <link rel="manifest" href="manifest.webmanifest" />
    </head>
    <body>
        <div class="game-container">
            <div class="board-container">
                <div class="board-header">
                    <h1 class="game-title">Static Chess</h1>
                    <div id="game-status" class="game-status">White's turn</div>
                </div>
                <div id="chess-board" class="chess-board" role="grid" aria-label="Chess board">
                    <!-- Board squares will be generated by JavaScript -->
                </div>
                <!-- One bar per player. CSS puts each on its own side of the board. -->
                <div class="captured-pieces" id="captured-pieces">
                    <div class="side-row side-black">
                        <span class="side-name">Black</span>
                        <div
                            class="captured-row"
                            id="captured-by-black"
                            role="img"
                            aria-label="Black has captured nothing."
                        ></div>
                        <span class="clock" id="clock-black" role="timer" hidden></span>
                    </div>
                    <div class="side-row side-white">
                        <span class="side-name">White</span>
                        <div
                            class="captured-row"
                            id="captured-by-white"
                            role="img"
                            aria-label="White has captured nothing."
                        ></div>
                        <span class="clock" id="clock-white" role="timer" hidden></span>
                    </div>
                </div>
            </div>
            <div class="game-info">
                <section class="panel-group moves-group" aria-labelledby="moves-title">
                    <h2 id="moves-title">Move History</h2>
                    <ul id="move-history" class="move-history"></ul>
                    <div
                        id="step-buttons"
                        class="step-buttons"
                        role="group"
                        aria-label="Step through the game"
                    >
                        <button class="btn" data-step="first" aria-label="Starting position">
                            &laquo;
                        </button>
                        <button class="btn" data-step="previous" aria-label="Previous move">
                            &lsaquo;
                        </button>
                        <button class="btn" data-step="next" aria-label="Next move">
                            &rsaquo;
                        </button>
                        <button class="btn" data-step="last" aria-label="Latest move">
                            &raquo;
                        </button>
                    </div>
                    <p id="review-score" class="review-score" hidden></p>
                    <button id="live-button" class="btn live-button" hidden>Back to game</button>
                </section>
                <div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>
                <div class="panel-group button-grid" role="group" aria-label="This game">
                    <button id="undo-button" class="btn" aria-label="Undo last move">Undo</button>
                    <button id="hint-button" class="btn" aria-label="Show a suggested move">
                        Hint
                    </button>
                    <button id="draw-button" class="btn">Offer draw</button>
                    <button id="resign-button" class="btn">Resign</button>
                </div>
                <div class="panel-group settings-container" role="group" aria-label="New game">
                    <div class="toggle-container" id="opponent-setting">
                        <label class="toggle-label" for="opponent-select">Opponent</label>
                        <select id="opponent-select">
                            <option value="human">Two players</option>
                            <option value="easy">Computer: easy</option>
                            <option value="medium">Computer: medium</option>
                            <option value="hard">Computer: hard</option>
                        </select>
                    </div>
                    <div class="toggle-container" id="side-setting" hidden>
                        <label class="toggle-label" for="side-select">Play as</label>
                        <select id="side-select">
                            <option value="w">White</option>
                            <option value="b">Black</option>
                        </select>
                    </div>
                    <div class="toggle-container" id="clock-setting">
                        <label class="toggle-label" for="clock-select">Clock</label>
                        <select id="clock-select" title="Applies from the next new game"></select>
                    </div>
                    <button id="reset-button" class="btn btn-primary">New Game</button>
                </div>
                <div
                    class="panel-group button-grid button-grid-3"
                    role="group"
                    aria-label="Copy or load a game"
                >
                    <button id="pgn-button" class="btn" aria-label="Copy the game as PGN">
                        Copy PGN
                    </button>
                    <button id="fen-button" class="btn" aria-label="Copy the position as FEN">
                        Copy FEN
                    </button>
                    <button id="import-button" class="btn" aria-label="Load a game from PGN">
                        Load PGN
                    </button>
                </div>
                <details class="panel-group more-settings" id="more-settings">
                    <summary>Settings</summary>
                    <div class="toggle-container">
                        <label class="toggle-label" for="board-theme-select">Board theme</label>
                        <select id="board-theme-select"></select>
                    </div>
                    <div class="toggle-container">
                        <label class="toggle-label" for="page-theme-select">Page theme</label>
                        <select id="page-theme-select">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                            <option value="auto">Match system</option>
                        </select>
                    </div>
                    <div class="toggle-container">
                        <label class="toggle-label" for="coords-toggle">Show coordinates</label>
                        <label class="switch">
                            <input type="checkbox" id="coords-toggle" />
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <label class="toggle-label" for="possible-moves-toggle"
                            >Show possible moves</label
                        >
                        <label class="switch">
                            <input type="checkbox" id="possible-moves-toggle" checked />
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <label class="toggle-label" for="last-move-toggle"
                            >Highlight last move</label
                        >
                        <label class="switch">
                            <input type="checkbox" id="last-move-toggle" checked />
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <label class="toggle-label" for="sound-toggle">Sound effects</label>
                        <label class="switch">
                            <input type="checkbox" id="sound-toggle" />
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <label class="toggle-label" for="flip-toggle">Flip board</label>
                        <label class="switch">
                            <input type="checkbox" id="flip-toggle" />
                            <span class="slider"></span>
                        </label>
                    </div>
                </details>
            </div>
        </div>

        <div id="import-dialog" class="promotion-backdrop" hidden>
            <div
                class="promotion-panel import-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="import-title"
            >
                <h3 id="import-title">Load a game</h3>
                <textarea
                    id="import-text"
                    rows="8"
                    spellcheck="false"
                    aria-label="Game in PGN format"
                    placeholder="Paste a game in PGN format, for example: 1. e4 e5 2. Nf3 Nc6"
                ></textarea>
                <p id="import-error" class="import-error" role="alert"></p>
                <div class="buttons-row">
                    <button id="import-cancel" class="btn">Cancel</button>
                    <button id="import-load" class="btn btn-primary">Load game</button>
                </div>
                <div id="archive-section" class="archive-section" hidden>
                    <h4 id="archive-title">Past games</h4>
                    <ul id="archive-list" class="archive-list" aria-labelledby="archive-title"></ul>
                </div>
            </div>
        </div>

        <script src="js/config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/pieces.js"></script>
        <script src="js/rules.js"></script>
        <script src="js/ai.js"></script>
        <script src="js/board.js"></script>
        <script src="js/drag.js"></script>
        <script src="js/promotion.js"></script>
        <script src="js/game.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
