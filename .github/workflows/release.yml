name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  create-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Notes live in releases/; the repository root is checked for older tags
          if [ -f "releases/RELEASE_NOTES_${TAG}.md" ]; then
            NOTES_FILE="releases/RELEASE_NOTES_${TAG}.md"
          elif [ -f "RELEASE_NOTES_${TAG}.md" ]; then
            NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          else
            NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
            printf '# Release %s\n\nSee [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for details.\n' \
              "$TAG" "$GITHUB_REPOSITORY" "$TAG" > "$NOTES_FILE"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release ${TAG}" --notes-file "$NOTES_FILE"
